    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio - SpiralDevs</title>

    <meta content="SpiralDevs" property="og:title" />
    <meta content="Portfolio of SpiralDevs" property="og:description" />

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../src/css/header.css">
    <link rel="stylesheet" href="../src/css/index.css">
    <link rel="stylesheet" href="portfolio.css">
</head>

<body>
    <div class="top-bar">
        <div class="home-icon">
            <a href="https://spiraldevs.xyz/">
                <img src="../src/images/svg/home.svg" alt="Home">
            </a>
        </div>
        <header>
            <nav>
                <div class="nav-container">
                    <ul class="nav_links">
                        <li>
                            <a href="https://spiraldevs.xyz/portfolio/" class="nav-item link-transition"
                                data-direction="left">Portfolio</a>
                        </li>
                        <li>
                            <a href="https://spiraldevs.xyz/devlogs/" class="nav-item link-transition"
                                data-direction="right">Devlogs</a>
                        </li>
                    </ul>
                </div>
            </nav>
        </header>
        <div class="github-link">
            <a href="https://github.com/SpiralDevs">
                <img src="../src/images/svg/github.svg" width="32" height="32" alt="GitHub">
            </a>

                <img src="../src/images/svg/itchio.svg" width="32" height="32" alt="Itch.io">
            </a>

    </div>

    <section id="portfolio-text" class="container">
        <h1>Portfolio</h1>
    </section>

    <section id="portfolio" class="container">
    </section>

    <footer>
        <div class="container">
            <p>&copy; 2025 SpiralDevs. All rights reserved.</p>
        </div>
    </footer>
    <script>
        function showModal(modalId) {
            const modal = document.getElementById(modalId);
            if (!modal) return;
            modal.style.display = 'block';
            window.location.hash = modalId.replace('modal-', '');
        }

        function closeModal(modal) {
            if (!modal) return;
            modal.style.display = 'none';
            history.pushState("", document.title, window.location.pathname);
        }

        function htmlToParagraphs(text) {
        if (!text) return [];
        // normalize newlines to <br>
        let normalized = String(text).replace(/\r\n|\n/g, '<br>');

        // make all <br> lowercase and self-closing for consistency
        normalized = normalized.replace(/<br\s*\/?>/gi, '<br>');

        // split on two or more consecutive <br> (with optional spaces)
        const parts = normalized.split(/(?:<br>\s*){2,}/)
            .map(s => s.trim())
            .filter(s => s.length > 0);

        return parts;
    }


        function renderProjects(projects) {
            const container = document.getElementById('portfolio');
            if (!container) return;

            projects.forEach(project => {
                const modalId = 'modal-' + project.id.toLowerCase();

                // Project card
                const projectDiv = document.createElement('div');
                projectDiv.className = 'project';

                if (project.source) {
                    const expandBtn = document.createElement('button');
                    expandBtn.className = 'expand-btn';
                    expandBtn.dataset.modal = modalId;
                    expandBtn.textContent = 'Learn More';
                    projectDiv.appendChild(expandBtn);

                    const img = document.createElement('img');
                    img.src = project.source;
                    img.alt = project.title || 'Project Image';
                    projectDiv.appendChild(img);
                }

                const content = document.createElement('div');
                content.className = 'project-content';
                if (project.id) content.id = project.id;

                const h2 = document.createElement('h2');
                h2.textContent = project.title || '';
                content.appendChild(h2);

                // Render short_description as paragraphs, preserving single <br> inside paragraphs.
                if (project.short_description) {
                    const parts = htmlToParagraphs(project.short_description);
                    parts.forEach(pHtml => {
                        const p = document.createElement('p');
                        p.innerHTML = pHtml; // safe for your own content from JSON
                        content.appendChild(p);
                    });
                }

                projectDiv.appendChild(content);

                const buttonsDiv = document.createElement('div');
                buttonsDiv.className = 'project-buttons';
                (project.links || []).filter(l => l.about_section === false).forEach(link => {
                    const a = document.createElement('a');
                    a.href = link.url;
                    a.className = 'button';
                    a.textContent = link.text;
                    a.target = '_blank';
                    a.rel = 'noopener noreferrer';
                    buttonsDiv.appendChild(a);
                });
                if (buttonsDiv.children.length) projectDiv.appendChild(buttonsDiv);

                container.appendChild(projectDiv);

                const hasModalContent = (project.description && project.description.trim()) || (project.links && project.links.length);
                if (project.source || hasModalContent) {
                    const modal = document.createElement('div');
                    modal.className = 'modal';
                    modal.id = modalId;

                    const modalContent = document.createElement('div');
                    modalContent.className = 'modal-content';

                    const closeBtn = document.createElement('button');
                    closeBtn.className = 'close-btn';
                    closeBtn.textContent = 'Close';
                    modalContent.appendChild(closeBtn);

                    const modalText = document.createElement('div');
                    modalText.className = 'modal-text';

                    const mh2 = document.createElement('h2');
                    mh2.textContent = project.title || '';
                    modalText.appendChild(mh2);

                    // Render description as paragraphs (fallback to short_description)
                    const descSource = project.description || project.short_description || '';
                    const descParts = htmlToParagraphs(descSource);
                    descParts.forEach(pHtml => {
                        const p = document.createElement('p');
                        p.innerHTML = pHtml;
                        modalText.appendChild(p);
                    });

                    modalContent.appendChild(modalText);

                    // Modal buttons
                    const modalButtonsDiv = document.createElement('div');
                    modalButtonsDiv.className = 'project-buttons';
                    const aboutLinks = (project.links || []).filter(l => l.about_section === true);
                    const linksToShow = aboutLinks.length ? aboutLinks : (project.links || []);
                    linksToShow.forEach(link => {
                        const a = document.createElement('a');
                        a.href = link.url;
                        a.className = 'button';
                        a.textContent = link.text;
                        a.target = '_blank';
                        a.rel = 'noopener noreferrer';
                        modalButtonsDiv.appendChild(a);
                    });
                    if (modalButtonsDiv.children.length) modalContent.appendChild(modalButtonsDiv);

                    modal.appendChild(modalContent);
                    document.body.appendChild(modal);
                }
            });

            // attach event listeners after DOM is created
            document.querySelectorAll('.expand-btn').forEach(button => {
                button.addEventListener('click', function () {
                    showModal(this.dataset.modal);
                });
            });

            document.querySelectorAll('.close-btn').forEach(button => {
                button.addEventListener('click', function () {
                    const modal = this.parentElement && this.parentElement.parentElement;
                    closeModal(modal);
                });
            });
        }

        window.addEventListener('load', function () {
            fetch('projects.json')
                .then(res => {
                    if (!res.ok) throw new Error('Failed to load projects.json');
                    return res.json();
                })
                .then(data => {
                    renderProjects(data.projects || []);
                    const hash = window.location.hash.substring(1);
                    if (hash) {
                        const modalId = 'modal-' + hash;
                        const modal = document.getElementById(modalId);
                        if (modal) showModal(modalId);
                    }
                })
                .catch(err => {
                    console.error('Error loading projects:', err);
                });
        });
    </script>

    <script type="text/javascript" src="../src/js/index.js"></script>
</body>

</html>
